name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          set +e
          npm test 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t homelab-atlas:test .
      - run: docker run -d --name atlas --read-only --tmpfs /tmp --tmpfs /data:size=16m,mode=1777 --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 homelab-atlas:test
      - run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl --fail http://127.0.0.1:8080/healthz; then
              curl --fail --silent --show-error http://127.0.0.1:8080/dashboard >/dev/null
              curl --fail --silent --show-error -X PUT \
                -H 'Content-Type: application/json' \
                -H 'X-Atlas-Default: 1' \
                --data-binary '{"schemaVersion":8,"title":"CI","devices":[],"networks":[]}' \
                http://127.0.0.1:8080/api/default-project
              curl --fail --silent --show-error http://127.0.0.1:8080/api/default-project | grep -F '"title":"CI"'
              curl --fail --silent --show-error -X DELETE -H 'X-Atlas-Default: 1' http://127.0.0.1:8080/api/default-project
              curl --fail --silent --show-error -X PUT \
                -H 'Content-Type: application/json' \
                -H 'X-Atlas-Branding: 1' \
                --data-binary '{"name":"CI Atlas","tabTitle":"CI","favicon":""}' \
                http://127.0.0.1:8080/api/branding
              curl --fail --silent --show-error http://127.0.0.1:8080/api/branding | grep -F '"name":"CI Atlas"'
              curl --fail --silent --show-error -X DELETE -H 'X-Atlas-Branding: 1' http://127.0.0.1:8080/api/branding
              exit 0
            fi
            sleep 1
          done
          docker logs atlas
          exit 1
